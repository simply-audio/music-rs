[package]
name = "simply-audio-capture"
description = "Capture any audio device by name: its inputs through cpal, or, for an output-only device, what is played on it through a CoreAudio process tap or WASAPI loopback; or tap applications, followed as they come and go; resampled to the rate asked for"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
cpal.workspace = true

# The output tap (macOS 14.2+). CATapDescription is an Objective-C class,
# hence objc2; libc for the read-only TCC check.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
libc = "0.2"

# The Windows taps: WASAPI endpoint and process loopback, through
# Microsoft's own bindings (the version cpal already brings on Windows).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
# What `windows`' `#[implement]` expands to: the completion handler process
# loopback's activation calls back.
windows-core = "0.62"
